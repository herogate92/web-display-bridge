<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title data-i18n="viewerTitle">WebDisplay Bridge 화면</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="viewer">
  <video id="screen" autoplay muted playsinline></video>
  <div id="overlay" class="overlay">
    <div class="viewer-login">
      <span class="eyebrow">WEB DISPLAY BRIDGE</span>
      <select id="viewer-language-login" class="language-select" aria-label="Language"><option value="ko">한국어</option><option value="en">English</option></select>
      <h1 data-i18n="viewerHeadline">작업 공간을 넓히세요.</h1>
      <div id="code-entry">
        <label for="connection-code" data-i18n="viewerCodeLabel">PC 화면의 연결 번호</label>
        <input id="connection-code" class="code-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="one-time-code" placeholder="0000">
        <p class="muted small" data-i18n="fourDigits">4자리 숫자를 입력하세요.</p>
      </div>
      <p id="message" role="status"></p>
      <button id="connect" class="primary" data-i18n="connectPlay">연결 / 재생</button>
      <p class="muted small" data-i18n="viewerHelp">PC의 키보드·마우스로 조작하세요. 소리는 PC에서 재생됩니다.</p>
    </div>
  </div>
  <nav class="viewer-controls">
    <span id="viewer-stats" data-i18n="waitingConnection">연결 대기</span>
    <select id="viewer-language" class="language-select" aria-label="Language"><option value="ko">한국어</option><option value="en">English</option></select>
    <button id="fullscreen" data-i18n="fullscreen">전체 화면</button>
    <button id="disconnect" data-i18n="disconnect">연결 끊기</button>
  </nav>
  <script src="viewer.js"></script>
</body>
</html>
