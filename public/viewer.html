<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>WebDisplay Bridge 화면</title><link rel="stylesheet" href="style.css"></head>
<body class="viewer"><video id="screen" autoplay muted playsinline></video><div id="overlay" class="overlay"><div class="viewer-login"><span class="eyebrow">WEBMONITOR</span><h1>작업 공간을 넓히세요.</h1><div id="code-entry"><label for="connection-code">PC 화면의 연결 번호</label><input id="connection-code" class="code-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="one-time-code" placeholder="0000"><p class="muted small">4자리 숫자를 입력하세요.</p></div><p id="message" role="status"></p><button id="connect" class="primary">연결 / 재생</button><p class="muted small">PC의 키보드·마우스로 조작하세요. 소리는 PC에서 재생됩니다.</p></div></div><nav class="viewer-controls"><span id="viewer-stats">연결 대기</span><button id="fullscreen">전체 화면</button><button id="disconnect">연결 끊기</button></nav><script src="viewer.js"></script></body></html>
